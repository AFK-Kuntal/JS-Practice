<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronus JS</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main class="main">
        <div class="container">
            <img src="" alt="country image" class="country-image">
            <div class="content">
                <p class="country-data country-name">Country Name: <span class="country-info">India</span></p>
                <p class="country-data country-popu">Population: <span class="country-info">137</span></p>
                <p class="country-data country-region">Region: <span class="country-info">Hindu</span></p>
                <p class="country-data country-lang">Language: <span class="country-info">Hindi</span></p>
                <p class="country-data country-curr">Currency: <span class="country-info">INR</span></p>
            </div>
        </div>
    </main>
</body>
</html>
