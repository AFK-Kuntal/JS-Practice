<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤷Guess Number</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <header>
      <section class="header-top">
        <button class="btn again">Again!</button>
        <p class="score-text">Number between 1 to 20</p>
      </section>
      <h1 class="header-text">Guess The Number!</h1>
      <div class="number">?</div>
    </header>
    <div class="divider"></div>
    <main>
      <section class="left">
        <input type="number" name="input-number" class="input-field" />
        <button class="btn click">Guess</button>
      </section>
      <section class="right">
        <p class="guess">Keep Guessing..</p>
        <p class="score">🎯Score:</p>
        <p class="HighScore">🔝HighScore</p>
      </section>

      <script src="script.js"></script>
    </main>
  </body>
</html>
